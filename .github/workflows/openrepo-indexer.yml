name: Refresh OpenRepo Android APK Index

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/openrepo-indexer.yml'
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: write

jobs:
  refresh-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OpenRepo branch
        uses: actions/checkout@v4
        with:
          ref: openrepo-store-v1
          fetch-depth: 0

      - name: Build APK catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 openrepo-indexer/indexer.py

      - name: Commit refreshed catalog
        run: |
          git config user.name "openrepo-indexer[bot]"
          git config user.email "openrepo-indexer[bot]@users.noreply.github.com"
          git add data/openrepo-android-index.json
          if git diff --cached --quiet; then
            echo "No catalog changes"
          else
            git commit -m "Refresh OpenRepo Android APK index"
            git push origin HEAD:openrepo-store-v1
          fi
