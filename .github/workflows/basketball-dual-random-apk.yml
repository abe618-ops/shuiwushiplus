name: Build Basketball Dual Random APK

on:
  workflow_dispatch:
  push:
    branches: [ basketball-dual-random-apk ]
    paths:
      - 'projects/basketball-dual-random/**'
      - '.github/workflows/basketball-dual-random-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate release keystore
        working-directory: projects/basketball-dual-random/app
        run: |
          keytool -genkeypair -v -keystore release.keystore -storepass dualrandom2026 -alias dualrandom -keypass dualrandom2026 -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=DualRandom, OU=Android, O=Shuiwushiplus, L=NA, S=NA, C=US"
      - name: Build release APK
        working-directory: projects/basketball-dual-random
        run: gradle assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DualRandomBasketball-v1.0.0
          path: projects/basketball-dual-random/app/build/outputs/apk/release/app-release.apk
