name: Build Meihua Football Random APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/meihua-football-random-apk
    paths:
      - 'projects/meihua-football-random/**'
      - '.github/workflows/build-meihua-football-random.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: projects/meihua-football-random
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Prepare named APK
        run: |
          cp projects/meihua-football-random/app/build/outputs/apk/debug/app-debug.apk MeihuaFootballBlind-v1.0-debug.apk
          sha256sum MeihuaFootballBlind-v1.0-debug.apk > MeihuaFootballBlind-v1.0-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: meihua-football-random-apk
          path: |
            MeihuaFootballBlind-v1.0-debug.apk
            MeihuaFootballBlind-v1.0-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
