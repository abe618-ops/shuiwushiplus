name: FootballQuant V4 MultiConsensus Android build

on:
  push:
    branches: [ football-fusion-v4-multiconsensus ]
    paths:
      - 'footballquant/**'
      - '.github/workflows/footballquant-temp-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: footballquant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build standalone V4 APK
        run: gradle assembleDebug --stacktrace
      - name: Show APK certificate
        run: keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk || true
      - uses: actions/upload-artifact@v4
        with:
          name: FootballQuant-V4-MultiConsensus-Standalone
          path: footballquant/app/build/outputs/apk/debug/*.apk
