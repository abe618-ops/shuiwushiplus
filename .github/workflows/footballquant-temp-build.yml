name: FootballQuant V4 FreeDivination Android build

on:
  push:
    branches: [ football-fusion-v4-free-divination ]
    paths:
      - 'footballquant/**'
      - '.github/workflows/footballquant-temp-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: footballquant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Create fresh standalone signing certificate
        run: |
          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=FootballQuant V4 FreeDivination 20260909,O=Standalone Blind Test,C=CN"
      - name: Build FreeDivination APK
        run: gradle assembleDebug --stacktrace
      - name: Verify APK signature and print certificate
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
      - name: Verify actual package id
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort | tail -1)
          "$AAPT" dump badging "$APK" | head -3
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.quant.football.fusion.v4.freecast'"
      - uses: actions/upload-artifact@v4
        with:
          name: FootballQuant-V4-FreeDivination-NewSignature
          path: footballquant/app/build/outputs/apk/debug/*.apk
