name: OddsFlow Android APK

on:
  push:
    paths:
      - 'projects/odds-flow-android/**'
      - '.github/workflows/odds-flow-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build installable debug APK
        working-directory: projects/odds-flow-android
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp projects/odds-flow-android/app/build/outputs/apk/debug/app-debug.apk OddsFlow-v0.1.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OddsFlow-v0.1.0-APK
          path: OddsFlow-v0.1.0-debug.apk
          if-no-files-found: error
