name: Build WebToVideo Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'projects/web-to-video-android/**'
      - '.github/workflows/web-to-video-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/web-to-video-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WebToVideo-v1.0-debug
          path: projects/web-to-video-android/app/build/outputs/apk/debug/app-debug.apk
