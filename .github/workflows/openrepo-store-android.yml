name: Build OpenRepo Store Android APK

on:
  workflow_dispatch:
  push:
    branches: [ openrepo-store-v1 ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openrepo-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: openrepo-store-debug-apk
          path: openrepo-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
