name: Build Seamless Clipboard Android APK

on:
  push:
    paths:
      - 'projects/seamless-clipboard-sync/android/**'
      - '.github/workflows/seamless-clipboard-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p projects/seamless-clipboard-sync/android :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp projects/seamless-clipboard-sync/android/app/build/outputs/apk/debug/app-debug.apk SeamlessClipboard-Android-v0.1.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SeamlessClipboard-Android-v0.1.0-debug
          path: SeamlessClipboard-Android-v0.1.0-debug.apk
