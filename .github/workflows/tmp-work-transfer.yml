name: Temporary APK Work Transfer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch APK from temporary release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download work-transfer-douyin-v1 --repo "$GITHUB_REPOSITORY" --pattern 'DouyinDownloader-Android-v1.0.0-arm64.apk' --dir .
          test "$(stat -c%s DouyinDownloader-Android-v1.0.0-arm64.apk)" -gt 10000000
          sha256sum DouyinDownloader-Android-v1.0.0-arm64.apk
      - name: Prepare text transfer probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'douyin-work-transfer-ok\n' > work-transfer-probe.txt
          gh release upload work-transfer-douyin-v1 work-transfer-probe.txt --clobber --repo "$GITHUB_REPOSITORY"
