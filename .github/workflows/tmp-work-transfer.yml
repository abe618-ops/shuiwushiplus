name: Temporary APK Work Transfer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch APK from temporary release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download work-transfer-douyin-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'DouyinDownloader-Android-v1.0.0-arm64.apk' \
            --dir .
          test "$(stat -c%s DouyinDownloader-Android-v1.0.0-arm64.apk)" -gt 10000000
          sha256sum DouyinDownloader-Android-v1.0.0-arm64.apk
      - name: Publish temporary transfer branch
        run: |
          mkdir /tmp/apk-transfer
          cp DouyinDownloader-Android-v1.0.0-arm64.apk /tmp/apk-transfer/
          git checkout --orphan work-transfer
          git rm -rf .
          cp /tmp/apk-transfer/DouyinDownloader-Android-v1.0.0-arm64.apk .
          git add DouyinDownloader-Android-v1.0.0-arm64.apk
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'temp: APK transfer'
          git push --force origin HEAD:work-transfer
