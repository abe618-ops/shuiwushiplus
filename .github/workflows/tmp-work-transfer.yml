name: Clean Temporary APK Work Transfer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove temporary public release and branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete work-transfer-douyin-v1 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/work-transfer" || true
