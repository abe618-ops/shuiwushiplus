name: Build Seamless Clipboard Ubuntu DEB

on:
  push:
    paths:
      - 'projects/seamless-clipboard-sync/linux/**'
      - '.github/workflows/seamless-clipboard-ubuntu-deb.yml'
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/seamless-clipboard-sync/linux
    steps:
      - uses: actions/checkout@v4
      - name: Build DEB
        run: |
          chmod +x build-deb.sh
          ./build-deb.sh 0.1.0
      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: seamless-clipboard-ubuntu-deb
          path: projects/seamless-clipboard-sync/linux/seamless-clipboard_0.1.0_all.deb
          if-no-files-found: error
