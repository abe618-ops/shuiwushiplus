name: Build Lei Formula Football APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/lei-formula-football-apk
    paths:
      - 'projects/lei-formula-football-android/**'
      - '.github/workflows/build-lei-formula-football.yml'
  pull_request:
    paths:
      - 'projects/lei-formula-football-android/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/lei-formula-football-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lei-formula-football-debug-apk
          path: projects/lei-formula-football-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
