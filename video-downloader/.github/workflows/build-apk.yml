name: Build Universal Video Downloader APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'video-downloader/android/**'
      - 'video-downloader/.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-downloader/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: universal-video-downloader-debug-apk
          path: video-downloader/android/app/build/outputs/apk/debug/app-debug.apk
